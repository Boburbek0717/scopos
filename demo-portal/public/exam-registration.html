<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam registration · Demo University Student Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-section="Exams">
<div class="layout">
  <main>
    <div class="crumbs"><a href="index.html">Home</a> › <a href="exams.html">Exams</a> › Exam registration</div>
    <h1>Exam registration</h1>
    <section class="card">
      <form class="filters" onsubmit="event.preventDefault()">
        <label>Term <select><option>2026/27 autumn</option><option>2025/26 spring</option></select></label>
        <label>Subject <select><option>All my subjects</option><option>Calculus I</option><option>Programming 1</option><option>Discrete Mathematics</option></select></label>
        <label>Exam type <select><option>All</option><option>Written</option><option>Oral</option></select></label>
        <label>Search <input type="search" placeholder="Subject name or code"></label>
        <button class="btn secondary" type="submit">Filter</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Code</th><th>Subject</th><th>Type</th><th>Date</th><th>Time</th><th>Room</th><th>Seats taken</th><th>Action</th></tr></thead>
          <tbody id="exam-rows"></tbody>
        </table>
      </div>
      <p class="muted">Registration for this exam period closes on Sat 6 Dec 2026, 23:59.</p>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
